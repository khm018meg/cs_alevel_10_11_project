<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do App</title>
  <style>
    :root {
      --primary: #206306;
      --primary-hover: #206306;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #70806b;
      --border: #e5e7eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --completed: #9ca3af;
      --radius: 12px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-group input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .filter-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      color: var(--text-main);
      background: #f3f4f6;
    }

    .filter-btn.active {
      color: #ffffff;
      background: var(--primary);
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .todo-item:hover {
      background: #f3f4f6;
    }

    .todo-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .todo-checkbox {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .todo-checkbox:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .todo-checkbox:checked::after {
      content: "";
      width: 5px;
      height: 10px;
      border: solid #ffffff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) translate(-1px, -1px);
      position: absolute;
    }

    .todo-text {
      font-size: 0.95rem;
      color: var(--text-main);
      word-break: break-word;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--completed);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: #fee2e2;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 30px 10px;
      font-size: 0.95rem;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-clear {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .btn-clear:hover {
      color: var(--danger-hover);
    }
  </style>
</head>

<body>

  <main class="app-container">
    <header>
      <h1>Task Master</h1>
      <p>Organize your day with ease</p>
    </header>

    <!-- Task Input Form -->
    <form id="todo-form" class="input-group">
      <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" required />
      <button type="submit" class="btn-primary">Add Task</button>
    </form>

    <!-- Filter Buttons -->
    <nav class="filters">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="active">Active</button>
      <button type="button" class="filter-btn" data-filter="completed">Completed</button>
    </nav>

    <!-- Tasks List -->
    <ul id="todo-list" class="todo-list"></ul>

    <!-- Footer Stats & Actions -->
    <footer class="footer">
      <span id="items-left">0 items left</span>
      <button type="button" id="clear-completed" class="btn-clear">Clear completed</button>
    </footer>
  </main>

  <script>
    // State management with LocalStorage
    const STORAGE_KEY = "todos_data";
    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: 1, text: "Welcome to your new To-Do app!", completed: false },
      { id: 2, text: "Click the checkbox to complete a task", completed: true },
      { id: 3, text: "Try adding your first task above", completed: false }
    ];

    let currentFilter = "all";

    // DOM Elements
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const todoList = document.getElementById("todo-list");
    const itemsLeft = document.getElementById("items-left");
    const clearCompletedBtn = document.getElementById("clear-completed");
    const filterButtons = document.querySelectorAll(".filter-btn");

    // Save tasks to LocalStorage
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    // Render tasks based on the current filter
    function renderTodos() {
      todoList.innerHTML = "";

      const filteredTodos = todos.filter((todo) => {
        if (currentFilter === "active") return !todo.completed;
        if (currentFilter === "completed") return todo.completed;
        return true;
      });

      if (filteredTodos.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = currentFilter === "completed"
          ? "No completed tasks yet."
          : "No tasks to show. You're all caught up!";
        todoList.appendChild(empty);
      } else {
        filteredTodos.forEach((todo) => {
          const li = document.createElement("li");
          li.className = `todo-item ${todo.completed ? "completed" : ""}`;

          // Left side: checkbox and task text
          const leftDiv = document.createElement("div");
          leftDiv.className = "todo-left";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "todo-checkbox";
          checkbox.checked = todo.completed;
          checkbox.addEventListener("change", () => toggleTodo(todo.id));

          const textSpan = document.createElement("span");
          textSpan.className = "todo-text";
          textSpan.textContent = todo.text;

          leftDiv.appendChild(checkbox);
          leftDiv.appendChild(textSpan);

          // Right side: delete button
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "btn-delete";
          deleteBtn.setAttribute("aria-label", "Delete task");
          deleteBtn.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          `;
          deleteBtn.addEventListener("click", () => deleteTodo(todo.id));

          li.appendChild(leftDiv);
          li.appendChild(deleteBtn);
          todoList.appendChild(li);
        });
      }

      // Update counters
      const activeCount = todos.filter((t) => !t.completed).length;
      itemsLeft.textContent = `${activeCount} item${activeCount === 1 ? "" : "s"} left`;
    }

    // Add a new todo
    function addTodo(text) {
      const trimmedText = text.trim();
      if (!trimmedText) return;

      const newTodo = {
        id: Date.now(),
        text: trimmedText,
        completed: false
      };

      todos.unshift(newTodo);
      saveTodos();
      renderTodos();
    }

    // Toggle completion status
    function toggleTodo(id) {
      todos = todos.map((todo) =>
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      saveTodos();
      renderTodos();
    }

    // Delete a todo
    function deleteTodo(id) {
      todos = todos.map((todo) => todo); // clone
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    // Event Listeners
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      addTodo(input.value);
      input.value = "";
    });

    clearCompletedBtn.addEventListener("click", () => {
      todos = todos.filter((todo) => !todo.completed);
      saveTodos();
      renderTodos();
    });

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderTodos();
      });
    });

    // Initial render on load
    renderTodos();
  </script>
</body>

</html>
